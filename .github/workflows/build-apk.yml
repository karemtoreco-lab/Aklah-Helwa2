name: Build Signed Aklah Helwa APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build and Sign Release APK
      run: gradle assembleRelease --no-daemon --no-configuration-cache -Djava.awt.headless=true -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/aklah-helwa-key.jks -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: Aklah-Helwa-Signed-APK
        path: app/build/outputs/apk/release/app-release.apk
